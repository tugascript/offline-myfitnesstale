plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android Gradle Plugin.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.myfitnesstale"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // Development identifier; replace it before an external release.
        applicationId = "com.example.myfitnesstale"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Development-only signing keeps `flutter run --release` available.
            // Production signing is a documented pre-release requirement.
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}
